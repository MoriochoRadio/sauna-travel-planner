name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Node 설정
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 타입체크
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 단위 테스트
        run: npm test

      - name: 빌드
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - name: Node 설정
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 빌드
        run: npm run build

      - name: E2E 테스트
        run: npx playwright test
