name: Verify Kakao

on:
  workflow_dispatch: # 수동 실행

jobs:
  kakao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 카카오 로컬 검색 실증
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: node scripts/test-kakao.mjs
